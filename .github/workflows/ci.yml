name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AI.Usage.slnx

      - name: Build
        run: >
          dotnet build AI.Usage.slnx
          --configuration Release
          --no-restore
          --warnaserror

      - name: Run tests
        run: >
          dotnet test AI.Usage.slnx
          --configuration Release
          --no-build

      - name: Install Macro Deck Plugin CLI
        run: >
          dotnet tool install
          --global
          macrodeck.plugin.cli
          --version 3.0.0-preview.10

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Run Macro Deck conformance tests
        run: >
          "$HOME/.dotnet/tools/macrodeck-plugin" test
          --project src/AI.Usage/AI.Usage.csproj
          --report markdown
          --output artifacts/conformance.md

      - name: Build plugin package
        shell: bash
        run: |
          set -euo pipefail

          "$HOME/.dotnet/tools/macrodeck-plugin" build \
            --source src/AI.Usage \
            --rid linux-x64 \
            --output ./artifacts \
            --force

      - name: Validate plugin for publication
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              -name '*.macroDeckPlugin' \
              -print \
              -quit
          )"

          if [ -z "$PACKAGE" ]; then
            echo "::error::Plugin package was not generated."
            exit 1
          fi

          echo "Package: $PACKAGE"

          "$HOME/.dotnet/tools/macrodeck-plugin" validate \
            --level publication \
            --artifact "$PACKAGE"
